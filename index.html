<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/55cffc8ff5.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <!-- header -->
      <div class="header">
        <div class="title">
          <h2>Friends IT</h2>
        </div>
        <div class="menu">
          <ul>
            <li><a href="">Home</a></li>
            <li><a href="">About</a></li>
            <li><a href="">Service</a></li>
            <li><a href="">Design</a></li>
            <li><a href="">Contact</a></li>
          </ul>
        </div>
        <div class="search">
          <form action="" class="frm-sc">
            <input type="text" placeholder="Search Course" />
            <button type="submit">Search</button>
          </form>
        </div>
      </div>

      <!-- body section -->
      <div class="content-body">
        <div class="left-con">
          <h1>
            Web Design & <br />
            <span class="special">Development <br /> </span>
            Course
          </h1>
          <p>
            Web Design is a specialisation of the design stream. They also use
            HTML,CSS and other languages to create design elements.
          </p>
          <a href="" class="join">Join Us</a>
        </div>
        <div class="right-con">
          <div class="log-in">
            <h4>Login Here</h4>
            <form action="">
              <input type="text" name="" id="" placeholder="Your Name" /> <br />
              <input
                type="password"
                name=""
                id=""
                placeholder="Your Password"
              />
              <br />
              <button type="submit">Login</button>
            </form>
            <div class="extra">
              <p class="ex-one">Don't have an account?</p>
              <p><a href="" class="ex-two">Sign Up</a> here</p>
              <p class="ex-three">Log in with</p>
            </div>
            <div class="login-ico">
              <ul>
                <li>
                  <a href=""><i class="fa-brands fa-google"></i></a>
                </li>
                <li>
                  <a href=""><i class="fa-brands fa-facebook"></i></a>
                </li>
                <li>
                  <a href=""><i class="fa-brands fa-twitter"></i></a>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
